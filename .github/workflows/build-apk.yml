name: Build Sona release APK
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified APK as a GitHub release
        type: boolean
        default: false
  push:
    branches: [main, v2-terminal]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.ORO_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/oro-release.jks
          cat >> android/gradle.properties <<GP
          ORO_KEYSTORE_FILE=$RUNNER_TEMP/oro-release.jks
          ORO_KEYSTORE_PASSWORD=${{ secrets.ORO_KEYSTORE_PASSWORD }}
          ORO_KEY_ALIAS=${{ secrets.ORO_KEY_ALIAS }}
          ORO_KEY_PASSWORD=${{ secrets.ORO_KEY_PASSWORD }}
          GP
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm64 -v
      - run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Sona.apk"
      - name: Verify production APK identity and certificate
        run: |
          APK="build/app/outputs/flutter-apk/Sona.apk"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)"
          "$SIGNER" verify --verbose --print-certs "$APK" | tee /tmp/certificate.txt
          # apksigner 36+ labels v2 certificates as 'V2 Signer', not 'Signer #1'.
          grep -Fx 'Number of signers: 1' /tmp/certificate.txt
          CERT_SHA="$(awk '/certificate SHA-256 digest:/ {print $NF}' /tmp/certificate.txt | sort -u)"
          test "$CERT_SHA" = '54cfa6b82110b0d377f1f93fd767e08bb93a97362996637cecdb9208858f24e0'
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='com.ambi.gold_paper_trading' versionCode='110' versionName='1.2.9'" /tmp/badging.txt
          grep -F "application-label:'Sona'" /tmp/badging.txt
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: sona-release-apk
          path: "build/app/outputs/flutter-apk/Sona.apk"
      - name: Publish verified release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.9 "build/app/outputs/flutter-apk/Sona.apk" --target "$GITHUB_SHA" --title "Sona v1.2.9 - Backtest profit factor and max drawdown" --latest --notes-file RELEASE_NOTES.md
