name: Sona 1.2.35 signal key-load repair and diagnostics (tests, no APK)
on:
  workflow_dispatch:
  push:
    branches: [frances09f-lgtm-patch-1]
    paths: ['ci/fix3.patch.b64']
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Kolkata
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: Apply reviewed source patch
        run: |
          set -euo pipefail
          if [ -f ci/fix3.patch.b64 ]; then
            base64 -d ci/fix3.patch.b64 > /tmp/fix3.patch
            git apply --whitespace=nowarn /tmp/fix3.patch
            git rm -q ci/fix3.patch.b64
          fi
          git status --short
      - run: flutter pub get
      - name: New tests, plain output
        continue-on-error: true
        run: flutter test --reporter expanded test/signal_status_test.dart test/signal_worker_keys_test.dart test/zz_settings_route_test.dart test/candle_debug_test.dart test/signal_pass_test.dart 2>&1 | tee /tmp/new.log
      - name: Full suite, plain output
        if: always()
        run: flutter test --reporter expanded 2>&1 | tee /tmp/full.log
      - name: Keep summaries
        if: always()
        run: |
          grep -E 'Some tests failed|All tests passed|\[E\]|FAILED|Error:|error:' /tmp/new.log | head -n 60 > test/goldens/ci_fix3_new_summary.txt || true
          tail -n 5 /tmp/new.log >> test/goldens/ci_fix3_new_summary.txt || true
          grep -E 'Some tests failed|All tests passed|\[E\]|FAILED' /tmp/full.log | head -n 60 > test/goldens/ci_fix3_full_summary.txt || true
          tail -n 5 /tmp/full.log >> test/goldens/ci_fix3_full_summary.txt || true
      - name: Commit patched source and summaries to this branch
        if: always()
        run: |
          git config user.name "sona-repair"
          git config user.email "sona-repair@users.noreply.github.com"
          git add lib test pubspec.yaml
          git add -u ci || true
          git commit -m "Sona 1.2.35: signal key-load repair and diagnostics" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
