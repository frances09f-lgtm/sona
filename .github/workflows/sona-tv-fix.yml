      - id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - id: flutter_sdk
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - id: signing
        name: Restore existing signing identity
        run: |
          echo "${{ secrets.ORO_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/sona-release.jks
          cat >> android/gradle.properties <<GP
          ORO_KEYSTORE_FILE=$RUNNER_TEMP/sona-release.jks
          ORO_KEYSTORE_PASSWORD=${{ secrets.ORO_KEYSTORE_PASSWORD }}
          ORO_KEY_ALIAS=${{ secrets.ORO_KEY_ALIAS }}
          ORO_KEY_PASSWORD=${{ secrets.ORO_KEY_PASSWORD }}
          GP
      - id: dependencies
        run: flutter pub get
      - id: flutter_tests
        name: Unit and widget tests
        run: |
          set -o pipefail
          flutter test --machine > /tmp/flutter-results.jsonl && OK=1 || OK=0
          python3 - <<'PYEOF'
          import json
          names, fails, errs = {}, [], []
          for line in open('/tmp/flutter-results.jsonl'):
              try: ev = json.loads(line)
              except Exception: continue
              if not isinstance(ev, dict): continue
              tev = ev.get('test')
              if ev.get('type') == 'test' and isinstance(tev, dict) and 'id' in tev:
                  names[tev['id']] = tev.get('name', '')
              if ev.get('type') == 'testDone' and ev.get('result') != 'success' and not ev.get('skipped'):
                  fails.append((ev.get('testID'), ev.get('result')))
              if ev.get('type') == 'error' and len(errs) < 5:
                  errs.append(str(ev.get('error'))[:400])
          for tid, res in fails[:40]: print('FAILED_TEST', res, names.get(tid, tid))
          for e in errs: print('TEST_ERROR', e)
          print('TOTAL_FAILURES', len(fails))
          PYEOF
          cp /tmp/flutter-results.jsonl /tmp/flutter-results-copy.jsonl || true
          [ "$OK" = 1 ]
      - name: Preserve raw test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-raw
          path: /tmp/flutter-results-copy.jsonl
          if-no-files-found: warn
      - name: Save tested source
        run: |
          set -euo pipefail
          git config user.name sona-repair
          git config user.email sona-repair@users.noreply.github.com
          git add lib/main.dart lib/tv_chart_page.dart pubspec.yaml
          git commit -m 'Sona 1.2.42 TEST: TradingView box on Trade tab behind toggle [skip ci]'
          git push origin HEAD:refs/heads/sona-tv-fix-src-${{ github.run_id }}
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - id: gradle_setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - id: apk_build
        run: flutter build apk --release --target-platform android-arm64
      - id: apk_verify_transport
        name: Verify signed APK identity and PRIVATE draft transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs "$APK" > /tmp/cert.txt
          grep -F '54cfa6b82110b0d377f1f93fd767e08bb93a97362996637cecdb9208858f24e0' /tmp/cert.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          sed -n '1p' /tmp/badging.txt > /tmp/package.txt
          cat /tmp/package.txt
          grep -F "name='com.ambi.gold_paper_trading' versionCode='144' versionName='1.2.42'" /tmp/package.txt
          grep -F "uses-permission: name='android.permission.INTERNET'" /tmp/badging.txt
          cp "$APK" /tmp/Sona.apk
          (cd /tmp && sha256sum Sona.apk) > /tmp/Sona.apk.sha256
          cat /tmp/Sona.apk.sha256
          printf 'Sona 1.2.42+144 TEST. Trade tab gains a [Sona chart | TradingView] toggle: the TradingView hosted widget box (same dark OANDA:XAUUSD 5m embed as 1.2.41) shows directly on Trade; Sona chart with signals stays one tap away. Choice persists; default TradingView. TradingView feed is not Twelve Data. Source: %s\n' "$SOURCE_SHA" > /tmp/Sona-test-source.txt
          TAG="test-tv-fix-144-${{ github.run_id }}"
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$SOURCE_SHA" -f name='Sona 1.2.42 TEST - TradingView on Trade tab (toggle)' -F draft=true -f body='Private verified TEST transport only. Not an official app release. Do not publish.' > /tmp/draft-before.json
          DRAFT=$(jq -er '.id' /tmp/draft-before.json)
          jq -e '.draft == true and .published_at == null and (.assets|length)==0' /tmp/draft-before.json
          gh release upload "$TAG" /tmp/Sona.apk /tmp/Sona.apk.sha256 /tmp/Sona-test-source.txt --repo "$GITHUB_REPOSITORY"
          gh api repos/$GITHUB_REPOSITORY/releases/$DRAFT > /tmp/draft-after.json
          jq -e '.draft == true and .published_at == null and (.assets|length)==3' /tmp/draft-after.json
          echo "DRAFT_URL=$(jq -r '.html_url' /tmp/draft-after.json)" >> "$GITHUB_ENV"
      - name: Upload APK artifact for capture job
        uses: actions/upload-artifact@v4
        with:
          name: sona-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - id: gofile
        name: Copy verified APK to gofile for phone delivery
        run: |
          set -eo pipefail
          curl -sS -F "file=@/tmp/Sona.apk" https://upload.gofile.io/uploadfile | python3 -c "import sys,json; d=json.load(sys.stdin); print('GOFILE', d.get('status'), d.get('data',{}).get('downloadPage'), d.get('data',{}).get('name'))"
      - name: Build emulator-compatible x64 APK for capture (same source, same signing)
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/sona-capture-x64.apk
          ls -la /tmp/sona-capture-x64.apk
      - name: Upload x64 capture APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sona-apk-x64
          path: /tmp/sona-capture-x64.apk
  capture:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || github.event.inputs.reuse_run_id != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kolkata
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.reuse_run_id == '' }}
        with:
          name: sona-apk-x64
          path: /tmp/apk
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.reuse_run_id != '' }}
        with:
          name: sona-apk-x64
          path: /tmp/apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.inputs.reuse_run_id }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator, install APK, capture Trade tab (TradingView default) and toggled Sona chart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r /tmp/apk/sona-capture-x64.apk
            adb shell monkey -p com.ambi.gold_paper_trading -c android.intent.category.LAUNCHER 1 || true
            adb shell pm grant com.ambi.gold_paper_trading android.permission.POST_NOTIFICATIONS || true
            for i in $(seq 1 24); do adb shell dumpsys activity activities | grep -E "ResumedActivity" | grep -q com.ambi.gold_paper_trading && break; sleep 5; done; true
            adb shell dumpsys activity activities | grep -E "ResumedActivity" > /tmp/fg.txt || true
            sleep 20
            cat /tmp/fg.txt || true
            adb exec-out screencap -p > /tmp/sona-trade-tv.png
            adb shell uiautomator dump /sdcard/ui.xml || true
            adb pull /sdcard/ui.xml /tmp/ui.xml || true
            echo  | base64 -d > /tmp/tap.py
            python3 /tmp/tap.py > /tmp/tapcoords || true
            cat /tmp/tapcoords || true
            if [ -s /tmp/tapcoords ]; then adb shell input tap $(cat /tmp/tapcoords); sleep 10; fi
            adb exec-out screencap -p > /tmp/sona-trade-after-toggle.png
            adb logcat -d -t 400 > /tmp/logcat.txt || true
      - name: Upload phone captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-captures
          path: |
            /tmp/sona-trade-tv.png
            /tmp/sona-trade-after-toggle.png
            /tmp/ui.xml
            /tmp/logcat.txt
            /tmp/fg.txt
          if-no-files-found: warn
      - id: gofile_caps
        name: Copy captures to gofile for inspection
        if: always()
        run: |
          set -uo pipefail
          for f in /tmp/sona-trade-tv.png /tmp/sona-trade-after-toggle.png; do
            [ -s "$f" ] || continue
            curl -sS -F "file=@$f" https://upload.gofile.io/uploadfile | python3 -c "import sys,json; d=json.load(sys.stdin); print('GOFILE-CAP', d.get('status'), d.get('data',{}).get('downloadPage'))" || true
          done
      - name: Record capture outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          { echo "capture outcome for run ${{ github.run_id }}"; ls -la /tmp/sona-trade-*.png 2>/dev/null || echo 'no screenshots produced'; } > /tmp/capture-final.txt
          gh release create "tv-fix-capture-${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --draft --target main --title "Trade-tab toggle capture status" --notes-file /tmp/capture-final.txt || true
