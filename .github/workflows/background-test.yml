name: Background paper order TEST only
on:
  workflow_dispatch:
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: Restore existing signing identity
        run: |
          echo "${{ secrets.ORO_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/sona-release.jks
          cat >> android/gradle.properties <<GP
          ORO_KEYSTORE_FILE=$RUNNER_TEMP/sona-release.jks
          ORO_KEYSTORE_PASSWORD=${{ secrets.ORO_KEYSTORE_PASSWORD }}
          ORO_KEY_ALIAS=${{ secrets.ORO_KEY_ALIAS }}
          ORO_KEY_PASSWORD=${{ secrets.ORO_KEY_PASSWORD }}
          GP
      - run: flutter pub get
      - name: Safety tests and exact source contracts
        run: flutter test test/friday_orders_test.dart test/background_order_contract_test.dart test/trade_safety_test.dart test/paper_margin_test.dart test/execution_ledger_test.dart test/pending_orders_test.dart
      - run: flutter build apk --release --target-platform android-arm64
      - name: Verify and save PRIVATE test only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs "$APK" > /tmp/cert.txt
          grep -F '54cfa6b82110b0d377f1f93fd767e08bb93a97362996637cecdb9208858f24e0' /tmp/cert.txt
          sha256sum "$APK"
          cp "$APK" /tmp/Sona.apk
          gh release create "test-bg-121-${GITHUB_RUN_NUMBER}" /tmp/Sona.apk --draft --target "$GITHUB_SHA" --title 'Private background paper order TEST - do not publish' --notes 'Native compile succeeded. Off-screen phone behavior unverified. Do not publish or place account trades during development.'
