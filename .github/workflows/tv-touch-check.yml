name: TradingView embed touch probe (investigation only, no app build)
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Embed URL to open in emulator Chrome'
        required: true
        default: 'https://www.tradingview.com/widgetembed/?symbol=OANDA%3AXAUUSD&interval=5&theme=dark&style=1&timezone=Asia%2FKolkata&withdateranges=1&hide_side_toolbar=false&allow_symbol_change=false&locale=en'
      tap1:
        description: 'x,y first tap (0,0 skips)'
        required: false
        default: '0,0'
      tap2:
        description: 'x,y second tap (0,0 skips)'
        required: false
        default: '0,0'
      tap3:
        description: 'x,y third tap (0,0 skips)'
        required: false
        default: '0,0'
      swipe1:
        description: 'x1,y1,x2,y2,ms first swipe (0,0,0,0,0 skips)'
        required: false
        default: '0,0,0,0,0'
      swipe2:
        description: 'x1,y1,x2,y2,ms second swipe (0,0,0,0,0 skips)'
        required: false
        default: '0,0,0,0,0'
jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator, dismiss Chrome first-run, open embed URL, capture staged screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb shell 'echo "chrome --disable-fre --no-first-run" > /data/local/tmp/chrome-command-line' || true
            adb shell pm list packages > /tmp/pkgs.txt || true
            grep -i chrome /tmp/pkgs.txt || true
            adb shell wm size || true
            adb shell am start -a android.intent.action.VIEW -d "${{ github.event.inputs.url }}" com.android.chrome || true
            sleep 8
            python3 - <<'PYEOF'
            import re, subprocess, time
            for rnd in range(3):
                subprocess.run(['adb', 'shell', 'uiautomator', 'dump', '/sdcard/ui0.xml'])
                subprocess.run(['adb', 'pull', '/sdcard/ui0.xml', '/tmp/ui0.xml'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                try:
                    data = open('/tmp/ui0.xml').read()
                except Exception as e:
                    print('ui0 unreadable', e)
                    break
                tapped = False
                for pat in ['use without an account', 'accept & continue', 'accept and continue', 'no thanks']:
                    for mm in re.finditer(r'<node[^>]*>', data):
                        tag = mm.group(0)
                        t = re.search(r'text="([^"]*)"', tag)
                        c = re.search(r'content-desc="([^"]*)"', tag)
                        label = ((t.group(1) if t else '') + ' ' + (c.group(1) if c else '')).lower()
                        if pat in label:
                            b = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', tag)
                            if b:
                                x = (int(b.group(1)) + int(b.group(3))) // 2
                                y = (int(b.group(2)) + int(b.group(4))) // 2
                                print('FRE round', rnd, 'tap', pat, x, y)
                                subprocess.run(['adb', 'shell', 'input', 'tap', str(x), str(y)])
                                tapped = True
                                break
                    if tapped:
                        break
                if not tapped:
                    print('FRE round', rnd, 'nothing to tap')
                    break
                time.sleep(4)
            PYEOF
            adb shell am start -a android.intent.action.VIEW -d "${{ github.event.inputs.url }}" com.android.chrome || true
            sleep 27
            adb exec-out screencap -p > /tmp/tv-loaded.png
            adb shell uiautomator dump /sdcard/ui1.xml || true
            adb pull /sdcard/ui1.xml /tmp/ui1.xml || true
            T1="${{ github.event.inputs.tap1 }}"; if [ "$T1" != "0,0" ]; then adb shell input tap ${T1%,*} ${T1#*,}; fi; sleep 4
            adb exec-out screencap -p > /tmp/tv-tap1.png
            adb shell uiautomator dump /sdcard/ui2.xml || true
            adb pull /sdcard/ui2.xml /tmp/ui2.xml || true
            T2="${{ github.event.inputs.tap2 }}"; if [ "$T2" != "0,0" ]; then adb shell input tap ${T2%,*} ${T2#*,}; fi; sleep 4
            adb exec-out screencap -p > /tmp/tv-tap2.png
            T3="${{ github.event.inputs.tap3 }}"; if [ "$T3" != "0,0" ]; then adb shell input tap ${T3%,*} ${T3#*,}; fi; sleep 4
            adb exec-out screencap -p > /tmp/tv-tap3.png
            S1="${{ github.event.inputs.swipe1 }}"; if [ "$S1" != "0,0,0,0,0" ]; then echo "$S1" | tr ',' ' ' | xargs adb shell input swipe; fi; sleep 4
            adb exec-out screencap -p > /tmp/tv-swipe1.png
            S2="${{ github.event.inputs.swipe2 }}"; if [ "$S2" != "0,0,0,0,0" ]; then echo "$S2" | tr ',' ' ' | xargs adb shell input swipe; fi; sleep 4
            adb exec-out screencap -p > /tmp/tv-swipe2.png
            adb shell uiautomator dump /sdcard/ui3.xml || true
            adb pull /sdcard/ui3.xml /tmp/ui3.xml || true
            python3 - <<'PYEOF'
            import re, glob
            for path in sorted(glob.glob('/tmp/ui*.xml')):
                try:
                    data = open(path).read()
                except Exception as e:
                    print(path, 'unreadable', e)
                    continue
                print('--- NODES', path, '---')
                for m in re.finditer(r'<node[^>]*>', data):
                    tag = m.group(0)
                    def attr(a):
                        mm = re.search(a + '="([^"]*)"', tag)
                        return mm.group(1) if mm else ''
                    txt = attr('text'); desc = attr('content-desc'); b = attr('bounds')
                    if txt or desc:
                        print(b, (txt or desc)[:80])
            PYEOF
      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-touch
          path: |
            /tmp/tv-*.png
            /tmp/ui*.xml
            /tmp/pkgs.txt
          if-no-files-found: warn
      - name: Print small captures into the log (gofile-independent)
        if: always()
        run: |
          for f in /tmp/tv-*.png; do
            [ -s "$f" ] || continue
            echo "=== B64IMG $f ==="
            convert "$f" -resize 420x png:- | base64 -w0 || true
            echo ""
          done
      - name: Copy captures to gofile for inspection
        if: always()
        run: |
          set -uo pipefail
          for f in /tmp/tv-*.png; do
            [ -s "$f" ] || continue
            curl -sS -F "file=@$f" https://upload.gofile.io/uploadfile | python3 -c "import sys,json; d=json.load(sys.stdin); print('GOFILE', '$f', d.get('status'), d.get('data',{}).get('downloadPage'))" || true
          done
