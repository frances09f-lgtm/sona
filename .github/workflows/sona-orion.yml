name: Sona 1.2.44 Orion UI signed TEST
on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: 'Skip build job; reuse sona-apk-x64 artifact from this previous run id (capture-only iteration)'
        required: false
        default: ''
      test_only:
        description: 'Run tests only; skip APK build, transport and capture (fast feedback)'
        required: false
        default: 'false'
jobs:
  build:
    if: ${{ github.event.inputs.reuse_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Kolkata
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-orion
      - name: Verify base carries the Orion UI source
        run: |
          grep -F "version: 1.2.44+146" pubspec.yaml
          grep -F "import 'orion.dart'" lib/main.dart
          test -f lib/orion.dart
      - id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - id: flutter_sdk
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - id: signing
        name: Restore existing signing identity
        run: |
          echo "${{ secrets.ORO_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/sona-release.jks
          cat >> android/gradle.properties <<GP
          ORO_KEYSTORE_FILE=$RUNNER_TEMP/sona-release.jks
          ORO_KEYSTORE_PASSWORD=${{ secrets.ORO_KEYSTORE_PASSWORD }}
          ORO_KEY_ALIAS=${{ secrets.ORO_KEY_ALIAS }}
          ORO_KEY_PASSWORD=${{ secrets.ORO_KEY_PASSWORD }}
          GP
      - id: dependencies
        run: flutter pub get
      - name: Regenerate goldens (intentional Orion restyle)
        continue-on-error: true
        run: flutter test --update-goldens 2>&1 | tail -n 5
      - name: Persist regenerated goldens
        continue-on-error: true
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add test/goldens
          git commit -m "Regenerate goldens for Orion restyle" || true
          git push origin HEAD:ui-orion || true
      - id: flutter_tests
        name: Unit and widget tests
        run: |
          set -o pipefail
          flutter test --machine > /tmp/flutter-results.jsonl && OK=1 || OK=0
          python3 - <<'PYEOF'
          import json, collections
          names, fails, prints = {}, [], collections.defaultdict(list)
          for line in open('/tmp/flutter-results.jsonl'):
              try: ev = json.loads(line)
              except Exception: continue
              if not isinstance(ev, dict): continue
              ty = ev.get('type')
              tev = ev.get('test')
              if ty == 'testStart' and isinstance(tev, dict) and 'id' in tev:
                  names[tev['id']] = tev.get('name', '')
              elif ty == 'testDone' and ev.get('result') != 'success' and not ev.get('skipped'):
                  fails.append(ev.get('testID'))
              elif ty == 'print':
                  prints[ev.get('testID')].append(str(ev.get('message','')))
          KEYS = ('EXCEPTION','Expected','Actual','Which','Bad state','No method','found no widgets','findsOneWidget','findsWidgets','pumpAndSettle timed out','overflowed','null')
          for tid in fails[:15]:
              print('FAILED_TEST', names.get(tid, tid))
              msgs = prints.get(tid, [])
              exc = [m for m in msgs if any(k in m for k in KEYS)]
              for m in (exc[:14] if exc else msgs[-8:]):
                  print('  LOG', m.replace(chr(10),' | ')[:400])
          print('TOTAL_FAILURES', len(fails))
          PYEOF
          cp /tmp/flutter-results.jsonl /tmp/flutter-results-copy.jsonl || true
          [ "$OK" = 1 ]
      - name: Preserve raw test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-raw
          path: /tmp/flutter-results-copy.jsonl
          if-no-files-found: warn
      - name: Record tested source
        if: ${{ github.event.inputs.test_only != 'true' }}
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - id: gradle_setup
        if: ${{ github.event.inputs.test_only != 'true' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - id: apk_build
        if: ${{ github.event.inputs.test_only != 'true' }}
        run: flutter build apk --release --target-platform android-arm64
      - id: apk_verify_transport
        if: ${{ github.event.inputs.test_only != 'true' }}
        name: Verify signed APK identity
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs "$APK" > /tmp/cert.txt
          grep -F '54cfa6b82110b0d377f1f93fd767e08bb93a97362996637cecdb9208858f24e0' /tmp/cert.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          sed -n '1p' /tmp/badging.txt > /tmp/package.txt
          cat /tmp/package.txt
          grep -F "name='com.ambi.gold_paper_trading' versionCode='146' versionName='1.2.44'" /tmp/package.txt
          grep -F "uses-permission: name='android.permission.INTERNET'" /tmp/badging.txt
          cp "$APK" /tmp/Sona.apk
          (cd /tmp && sha256sum Sona.apk) > /tmp/Sona.apk.sha256
          cat /tmp/Sona.apk.sha256
          printf 'Sona 1.2.44+146 TEST (Orion UI layout fix). Signed with the existing release identity. No changes to data, signals, orders, or balances. Source: %s\n' "$SOURCE_SHA" > /tmp/Sona-test-source.txt
          cat /tmp/Sona-test-source.txt
      - name: Upload APK artifact for capture job
        if: ${{ github.event.inputs.test_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sona-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
      - id: gofile
        if: ${{ github.event.inputs.test_only != 'true' }}
        continue-on-error: true
        name: Copy verified APK to gofile for phone delivery
        run: |
          set -eo pipefail
          curl -sS -F "file=@/tmp/Sona.apk" https://upload.gofile.io/uploadfile | python3 -c "import sys,json; d=json.load(sys.stdin); print('GOFILE', d.get('status'), d.get('data',{}).get('downloadPage'), d.get('data',{}).get('name'))"
      - name: Build emulator-compatible x64 APK for capture (same source, same signing)
        if: ${{ github.event.inputs.test_only != 'true' }}
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/sona-capture-x64.apk
          ls -la /tmp/sona-capture-x64.apk
      - name: Upload x64 capture APK artifact
        if: ${{ github.event.inputs.test_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sona-apk-x64
          path: /tmp/sona-capture-x64.apk
          retention-days: 1
  capture:
    needs: build
    if: ${{ always() && github.event.inputs.test_only != 'true' && (needs.build.result == 'success' || github.event.inputs.reuse_run_id != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kolkata
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.reuse_run_id == '' }}
        with:
          name: sona-apk-x64
          path: /tmp/apk
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.reuse_run_id != '' }}
        with:
          name: sona-apk-x64
          path: /tmp/apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.inputs.reuse_run_id }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator, install APK, capture all five tabs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r /tmp/apk/sona-capture-x64.apk
            adb shell pm grant com.ambi.gold_paper_trading android.permission.POST_NOTIFICATIONS || true
            echo  | base64 -d > /tmp/launch.sh
            bash /tmp/launch.sh
            adb exec-out screencap -p > /tmp/sona-orion-trade.png
            echo  | base64 -d > /tmp/pick.py
            # --- extended captures: inline Sona chart, Settings, alert sheet, populated states ---
            adb shell rm -f /sdcard/ui.xml; adb shell uiautomator dump /sdcard/ui.xml || (sleep 3; adb shell uiautomator dump /sdcard/ui.xml || true)
            rm -f /tmp/ui.xml; adb pull /sdcard/ui.xml /tmp/ui.xml || (sleep 2; adb pull /sdcard/ui.xml /tmp/ui.xml || true)
            python3 /tmp/pick.py /tmp/ui.xml match '(?i)Tab Trade' /tmp/tapT || true
            if [ -s /tmp/tapT ]; then adb shell input tap $(cat /tmp/tapT); sleep 5; fi
            adb shell rm -f /sdcard/ui.xml; adb shell uiautomator dump /sdcard/ui.xml || (sleep 3; adb shell uiautomator dump /sdcard/ui.xml || true)
            rm -f /tmp/ui.xml; adb pull /sdcard/ui.xml /tmp/ui.xml || (sleep 2; adb pull /sdcard/ui.xml /tmp/ui.xml || true)
            python3 /tmp/pick.py /tmp/ui.xml match '(?i)^Sona chart$' /tmp/tapC || true
            if [ -s /tmp/tapC ] && grep -q 'webkit.WebView' /tmp/ui.xml; then adb shell input tap $(cat /tmp/tapC); sleep 8; fi
            adb exec-out screencap -p > /tmp/sona-orion-trade-inline.png
            adb shell input swipe 540 1800 540 700 400 || true
            sleep 3
            adb exec-out screencap -p > /tmp/sona-orion-trade-inline-scrolled.png
            adb shell input swipe 540 700 540 1800 400 || true
            sleep 2
            # Settings: gear = leftmost of the round header buttons (no label)
            adb shell dumpsys activity activities | grep ResumedActivity | grep -q com.ambi.gold_paper_trading || { echo FG_LOST; exit 1; }
            # Alert sheet: inline Trade > fullscreen > add_alert > tap chart
            adb shell rm -f /sdcard/ui.xml; adb shell uiautomator dump /sdcard/ui.xml || (sleep 3; adb shell uiautomator dump /sdcard/ui.xml || true)
            rm -f /tmp/ui.xml; adb pull /sdcard/ui.xml /tmp/ui.xml || (sleep 2; adb pull /sdcard/ui.xml /tmp/ui.xml || true)
            python3 /tmp/pick.py /tmp/ui.xml match '(?i)Tab Trade' /tmp/tapT2 || true
            if [ -s /tmp/tapT2 ]; then adb shell input tap $(cat /tmp/tapT2); sleep 5; fi
            adb shell rm -f /sdcard/ui.xml; adb shell uiautomator dump /sdcard/ui.xml || (sleep 3; adb shell uiautomator dump /sdcard/ui.xml || true)
            rm -f /tmp/ui.xml; adb pull /sdcard/ui.xml /tmp/ui.xml || (sleep 2; adb pull /sdcard/ui.xml /tmp/ui.xml || true)
            python3 /tmp/pick.py /tmp/ui.xml match '(?i)^Sona chart$' /tmp/tapC2 || true
            if [ -s /tmp/tapC2 ] && grep -q 'webkit.WebView' /tmp/ui.xml; then adb shell input tap $(cat /tmp/tapC2); sleep 6; fi
            adb shell rm -f /sdcard/ui.xml; adb shell uiautomator dump /sdcard/ui.xml || (sleep 3; adb shell uiautomator dump /sdcard/ui.xml || true)
            rm -f /tmp/ui.xml; adb pull /sdcard/ui.xml /tmp/ui.xml || (sleep 2; adb pull /sdcard/ui.xml /tmp/ui.xml || true)
            adb shell input tap 981 967 || true
            sleep 5
            adb shell input tap 66 1862 || true
            sleep 2
            adb shell input tap 560 1100 || true
            sleep 3
            adb shell rm -f /sdcard/ui.xml; adb shell uiautomator dump /sdcard/ui.xml || (sleep 3; adb shell uiautomator dump /sdcard/ui.xml || true)
            rm -f /tmp/ui.xml; adb pull /sdcard/ui.xml /tmp/ui.xml || (sleep 2; adb pull /sdcard/ui.xml /tmp/ui.xml || true)
            grep -q 'Price alerts' /tmp/ui.xml && echo ALERT_SHEET_OPEN || echo ALERT_SHEET_NOT_FOUND
            adb exec-out screencap -p > /tmp/sona-orion-alert.png
            adb shell input keyevent 4 || true
            sleep 2
            adb shell rm -f /sdcard/ui.xml; adb shell uiautomator dump /sdcard/ui.xml || (sleep 3; adb shell uiautomator dump /sdcard/ui.xml || true)
            rm -f /tmp/ui.xml; adb pull /sdcard/ui.xml /tmp/ui.xml || (sleep 2; adb pull /sdcard/ui.xml /tmp/ui.xml || true)
            adb shell input tap 605 200 || true
            sleep 5
            adb exec-out screencap -p > /tmp/sona-orion-settings.png
            adb shell input keyevent 4 || true
            sleep 3
            echo  | base64 -d > /tmp/nodes.py
            adb shell rm -f /sdcard/ui.xml; adb shell uiautomator dump /sdcard/ui.xml || (sleep 3; adb shell uiautomator dump /sdcard/ui.xml || true)
            rm -f /tmp/ui.xml; adb pull /sdcard/ui.xml /tmp/ui.xml || (sleep 2; adb pull /sdcard/ui.xml /tmp/ui.xml || true)
            python3 /tmp/nodes.py /tmp/ui.xml '(?i)Tab Portfolio' /tmp/tapP || true
            if [ -s /tmp/tapP ]; then adb shell input tap $(cat /tmp/tapP); fi
            sleep 5
            adb exec-out screencap -p > /tmp/sona-orion-portfolio.png
            adb shell rm -f /sdcard/ui.xml; adb shell uiautomator dump /sdcard/ui.xml || (sleep 3; adb shell uiautomator dump /sdcard/ui.xml || true)
            rm -f /tmp/ui.xml; adb pull /sdcard/ui.xml /tmp/ui.xml || (sleep 2; adb pull /sdcard/ui.xml /tmp/ui.xml || true)
            python3 /tmp/nodes.py /tmp/ui.xml '(?i)Tab Add' /tmp/tapA || true
            if [ -s /tmp/tapA ]; then adb shell input tap $(cat /tmp/tapA); fi
            sleep 5
            adb exec-out screencap -p > /tmp/sona-orion-add.png
            adb shell rm -f /sdcard/ui.xml; adb shell uiautomator dump /sdcard/ui.xml || (sleep 3; adb shell uiautomator dump /sdcard/ui.xml || true)
            rm -f /tmp/ui.xml; adb pull /sdcard/ui.xml /tmp/ui.xml || (sleep 2; adb pull /sdcard/ui.xml /tmp/ui.xml || true)
            python3 /tmp/nodes.py /tmp/ui.xml '(?i)Tab Stats' /tmp/tapS || true
            if [ -s /tmp/tapS ]; then adb shell input tap $(cat /tmp/tapS); fi
            sleep 5
            adb exec-out screencap -p > /tmp/sona-orion-stats.png
            adb shell rm -f /sdcard/ui.xml; adb shell uiautomator dump /sdcard/ui.xml || (sleep 3; adb shell uiautomator dump /sdcard/ui.xml || true)
            rm -f /tmp/ui.xml; adb pull /sdcard/ui.xml /tmp/ui.xml || (sleep 2; adb pull /sdcard/ui.xml /tmp/ui.xml || true)
            python3 /tmp/nodes.py /tmp/ui.xml '(?i)Tab AI' /tmp/tapI || true
            if [ -s /tmp/tapI ]; then adb shell input tap $(cat /tmp/tapI); fi
            sleep 5
            adb exec-out screencap -p > /tmp/sona-orion-ai.png
            adb shell monkey -p com.ambi.gold_paper_trading -c android.intent.category.LAUNCHER 1 || true
            sleep 10
            # Populated states via real UI entry (isolated test install)
            adb shell rm -f /sdcard/ui.xml; adb shell uiautomator dump /sdcard/ui.xml || (sleep 3; adb shell uiautomator dump /sdcard/ui.xml || true)
            rm -f /tmp/ui.xml; adb pull /sdcard/ui.xml /tmp/ui.xml || (sleep 2; adb pull /sdcard/ui.xml /tmp/ui.xml || true)
            python3 /tmp/pick.py /tmp/ui.xml match '(?i)Tab Add' /tmp/tapA2 || true
            if [ -s /tmp/tapA2 ]; then adb shell input tap $(cat /tmp/tapA2); sleep 4; fi
            adb shell rm -f /sdcard/ui.xml; adb shell uiautomator dump /sdcard/ui.xml || (sleep 3; adb shell uiautomator dump /sdcard/ui.xml || true)
            rm -f /tmp/ui.xml; adb pull /sdcard/ui.xml /tmp/ui.xml || (sleep 2; adb pull /sdcard/ui.xml /tmp/ui.xml || true)
            python3 /tmp/pick.py /tmp/ui.xml match '(?i)Pending buy order' /tmp/tapPB || true
            if [ -s /tmp/tapPB ]; then adb shell input tap $(cat /tmp/tapPB); sleep 3; fi
            adb shell rm -f /sdcard/ui.xml; adb shell uiautomator dump /sdcard/ui.xml || (sleep 3; adb shell uiautomator dump /sdcard/ui.xml || true)
            rm -f /tmp/ui.xml; adb pull /sdcard/ui.xml /tmp/ui.xml || (sleep 2; adb pull /sdcard/ui.xml /tmp/ui.xml || true)
            python3 /tmp/pick.py /tmp/ui.xml edit 0 /tmp/tapE || true
            if [ -s /tmp/tapE ]; then adb shell input tap $(cat /tmp/tapE); sleep 1; adb shell input text '3550.00'; sleep 1; fi
            adb shell rm -f /sdcard/ui.xml; adb shell uiautomator dump /sdcard/ui.xml || (sleep 3; adb shell uiautomator dump /sdcard/ui.xml || true)
            rm -f /tmp/ui.xml; adb pull /sdcard/ui.xml /tmp/ui.xml || (sleep 2; adb pull /sdcard/ui.xml /tmp/ui.xml || true)
            python3 /tmp/pick.py /tmp/ui.xml match '(?i)Save pending order' /tmp/tapS2 || true
            if [ -s /tmp/tapS2 ]; then adb shell input tap $(cat /tmp/tapS2); sleep 4; fi
            adb exec-out screencap -p > /tmp/sona-orion-add-populated.png
            adb shell rm -f /sdcard/ui.xml; adb shell uiautomator dump /sdcard/ui.xml || (sleep 3; adb shell uiautomator dump /sdcard/ui.xml || true)
            rm -f /tmp/ui.xml; adb pull /sdcard/ui.xml /tmp/ui.xml || (sleep 2; adb pull /sdcard/ui.xml /tmp/ui.xml || true)
            python3 /tmp/pick.py /tmp/ui.xml match '(?i)Tab Portfolio' /tmp/tapP2 || true
            if [ -s /tmp/tapP2 ]; then adb shell input tap $(cat /tmp/tapP2); sleep 4; fi
            adb exec-out screencap -p > /tmp/sona-orion-portfolio-populated.png
      - name: Copy phone captures to gofile for review transport
        if: always()
        run: |
          set -eo pipefail
          cd /tmp && tar czf sona-orion-captures.tgz $(ls sona-orion-*.png 2>/dev/null)
          curl -sS -F "file=@/tmp/sona-orion-captures.tgz" https://upload.gofile.io/uploadfile | python3 -c "import sys,json; d=json.load(sys.stdin); print('GOFILE_CAPS', d.get('status'), d.get('data',{}).get('downloadPage'), d.get('data',{}).get('name'))"
      - name: Upload phone captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-captures
          path: |
            /tmp/sona-orion-*.png
            /tmp/ui.xml
              /tmp/logcat.txt
              /tmp/crashes.txt
              /tmp/procs.txt
          if-no-files-found: warn
      - id: gofile_caps
        name: Copy captures to gofile for inspection
        if: always()
        run: |
          set -uo pipefail
          for f in /tmp/sona-orion-trade.png /tmp/sona-orion-portfolio.png /tmp/sona-orion-add.png /tmp/sona-orion-stats.png /tmp/sona-orion-ai.png; do
            [ -s "$f" ] || continue
            curl -sS -F "file=@$f" https://upload.gofile.io/uploadfile | python3 -c "import sys,json; d=json.load(sys.stdin); print('GOFILE-CAP', d.get('status'), d.get('data',{}).get('downloadPage'))" || true
          done

