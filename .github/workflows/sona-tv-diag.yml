name: Sona WebView CDP diagnostic (investigation only, no delivery)
on:
  workflow_dispatch:

jobs:
  build-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sona-tv-fs-src-44729709092
      - id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - id: flutter_sdk
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - id: signing
        name: Restore existing signing identity
        run: |
          echo "${{ secrets.ORO_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/sona-release.jks
          cat >> android/gradle.properties <<GP
          ORO_KEYSTORE_FILE=$RUNNER_TEMP/sona-release.jks
          ORO_KEYSTORE_PASSWORD=${{ secrets.ORO_KEYSTORE_PASSWORD }}
          ORO_KEY_ALIAS=${{ secrets.ORO_KEY_ALIAS }}
          ORO_KEY_PASSWORD=${{ secrets.ORO_KEY_PASSWORD }}
          GP
      - name: Mark manifest debuggable for WebView CDP (diagnostic only)
        run: |
          set -euo pipefail
          sed -i '0,/<application/s//<application android:debuggable="true"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:debuggable="true"' android/app/src/main/AndroidManifest.xml
      - id: dependencies
        run: flutter pub get
      - id: gradle_setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - id: apk_build
        run: flutter build apk --release --target-platform android-x64
      - name: Verify debuggable flag in built APK
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump xmltree build/app/outputs/flutter-apk/app-release.apk AndroidManifest.xml | grep -i debuggable
      - name: Upload diagnostic x64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sona-diag-x64
          path: build/app/outputs/flutter-apk/app-release.apk
  probe:
    needs: build-diag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sona-diag-x64
          path: /tmp/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install diagnostic APK, spawn horizontal line, run WebView CDP probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r /tmp/apk/app-release.apk
            adb shell monkey -p com.ambi.gold_paper_trading -c android.intent.category.LAUNCHER 1 || true
            adb shell pm grant com.ambi.gold_paper_trading android.permission.POST_NOTIFICATIONS || true
            for i in $(seq 1 24); do adb shell dumpsys activity activities | grep -E "ResumedActivity" | grep -q com.ambi.gold_paper_trading && break; sleep 5; done; true
            sleep 45
            adb shell uiautomator dump /sdcard/ui.xml || true
            adb pull /sdcard/ui.xml /tmp/ui.xml || true
            echo  | base64 -d > /tmp/tap.py
            python3 /tmp/tap.py > /tmp/tapcoords || true
            cat /tmp/tapcoords || true
            if [ -s /tmp/tapcoords ]; then adb shell input tap $(cat /tmp/tapcoords); fi
            for i in $(seq 1 10); do sleep 6; adb exec-out screencap -p > /tmp/probe-open.png; S1=$(stat -c%s /tmp/probe-open.png); sleep 4; adb exec-out screencap -p > /tmp/probe-open2.png; S2=$(stat -c%s /tmp/probe-open2.png); if [ "$S1" = "$S2" ] && [ "$i" -ge 3 ]; then break; fi; done
            sleep 3
            adb shell input tap 75 540 || true
            sleep 3
            adb shell input tap 270 1182 || true
            sleep 4
            adb exec-out screencap -p > /tmp/tv-diag-0-adb-spawn.png
            pip install --quiet websocket-client || pip3 install --quiet websocket-client || true
            PID=$(adb shell pidof com.ambi.gold_paper_trading | tr -d '\r ')
            echo "APP_PID=$PID"
            adb shell cat /proc/net/unix | grep -i devtools || true
            adb forward tcp:9223 localabstract:webview_devtools_remote_$PID || true
            curl -s http://localhost:9223/json/list | head -c 600 || true
            echo  | base64 -d > /tmp/cdp_diag.py
            CDP_PORT=9223 python3 /tmp/cdp_diag.py || true
            adb shell 'input tap 526 1207; sleep 0.15; input tap 526 1207' || true
            sleep 2
            adb shell input swipe 526 1207 526 1000 600 || true
            sleep 3
            adb exec-out screencap -p > /tmp/tv-diag-5-adb-after-osdrag.png
            echo  | base64 -d > /tmp/cdp_post.py
            CDP_PORT=9223 python3 /tmp/cdp_post.py || true
            adb logcat -d -t 300 > /tmp/logcat.txt || true
      - name: Upload probe captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-captures
          path: |
            /tmp/tv-diag-*.png
            /tmp/tv-cdp-*.png
            /tmp/logcat.txt
          if-no-files-found: warn
      - name: Copy captures to gofile
        if: always()
        run: |
          for f in /tmp/tv-diag-*.png /tmp/tv-cdp-*.png; do
            [ -f "$f" ] || continue
            curl -sS -F "file=@$f" https://upload.gofile.io/uploadfile | python3 -c "import sys,json; d=json.load(sys.stdin); print('GOFILE', '$f', d.get('status'), d.get('data',{}).get('downloadPage'))" || true
          done
