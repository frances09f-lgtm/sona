name: Pending entry-price TEST only
on:
  workflow_dispatch:
  push:
    branches: [fix/add-pending-price]
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: Restore existing signing identity
        run: |
          echo "${{ secrets.ORO_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/sona-release.jks
          cat >> android/gradle.properties <<GP
          ORO_KEYSTORE_FILE=$RUNNER_TEMP/sona-release.jks
          ORO_KEYSTORE_PASSWORD=${{ secrets.ORO_KEYSTORE_PASSWORD }}
          ORO_KEY_ALIAS=${{ secrets.ORO_KEY_ALIAS }}
          ORO_KEY_PASSWORD=${{ secrets.ORO_KEY_PASSWORD }}
          GP
      - run: flutter pub get
      - name: Safety tests and exact source contracts
        run: flutter test
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Verify release unit-test task exists before APK compilation
        run: |
          set -euo pipefail
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")" "$ANDROID_HOME" > android/local.properties
          cd android
          gradle :app:tasks --all > /tmp/sona-task-inventory.txt
          grep -E '^testReleaseUnitTest[[:space:]-]' /tmp/sona-task-inventory.txt
      - run: flutter build apk --release --target-platform android-arm64
      - name: Native caller and concurrent claim tests
        run: |
          set -euo pipefail
          (cd android && ./gradlew :app:testReleaseUnitTest)
          python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as E
          paths=glob.glob('build/app/test-results/testReleaseUnitTest/TEST-*.xml')
          roots=[E.parse(p).getroot() for p in paths]
          cases=[c for r in roots for c in r.findall('testcase')]
          expected={'concurrentUiAndHeadlessClaimOnlyOnce','replayedIdNeverBecomesExecutableAgain','distinctOrderCanBeClaimedAfterPriorConsumption','unrelatedUidIsDenied'}
          found={c.attrib['name'] for c in cases if c.attrib.get('classname')=='com.ambi.gold_paper_trading.FridayOrderStoreTest'}
          assert expected <= found, (paths,found)
          assert all(int(r.attrib.get(k,0))==0 for r in roots for k in ('failures','errors','skipped'))
          print('Native JUnit executed:',len(cases),'failures=0 errors=0 skipped=0')
          for c in cases: print(c.attrib['classname']+'.'+c.attrib['name'])
          PYTEST
      - name: Verify signed APK identity and PRIVATE draft transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs "$APK" > /tmp/cert.txt
          grep -F '54cfa6b82110b0d377f1f93fd767e08bb93a97362996637cecdb9208858f24e0' /tmp/cert.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          sed -n '1p' /tmp/badging.txt > /tmp/package.txt
          cat /tmp/package.txt
          grep -F "name='com.ambi.gold_paper_trading' versionCode='122' versionName='1.2.20'" /tmp/package.txt
          cp "$APK" /tmp/Sona.apk
          (cd /tmp && sha256sum Sona.apk) > /tmp/Sona.apk.sha256
          cat /tmp/Sona.apk.sha256
          printf 'Source: %s\nRun: %s/%s/actions/runs/%s\nPrivate test only. Full Flutter and native JUnit gates passed. Entry-price orders require open app and internet. Phone behavior unverified. Do not publish.\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/Sona-test-source.txt
          TAG="test-entry-122-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title 'Sona 1.2.20 TEST - entry-price orders' --notes 'Private test transport only. Not an official app release. Automated tests passed; phone behavior unverified. Do not publish.'
          DRAFT=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id")
          test -n "$DRAFT"
          gh api repos/$GITHUB_REPOSITORY/releases/$DRAFT > /tmp/draft-before.json
          jq -e '.draft == true and .published_at == null and (.assets|length)==0' /tmp/draft-before.json
          UPLOAD=$(jq -r '.upload_url|split("{")[0]' /tmp/draft-before.json)
          for NAME in Sona.apk Sona.apk.sha256 Sona-test-source.txt; do
            TYPE=application/octet-stream
            CODE=$(curl --silent --show-error --output /tmp/asset.json --write-out '%{http_code}' --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Content-Type: $TYPE" --data-binary "@/tmp/$NAME" "$UPLOAD?name=$NAME")
            if [ "$CODE" != 201 ]; then echo "Private upload failed HTTP $CODE"; jq '{message,errors}' /tmp/asset.json; exit 1; fi
            jq -e --arg name "$NAME" '.name==$name and .state=="uploaded" and .size>0' /tmp/asset.json
            jq '{id,name,size,browser_download_url}' /tmp/asset.json
          done
          gh api repos/$GITHUB_REPOSITORY/releases/$DRAFT > /tmp/draft-after.json
          jq -e '.draft == true and .published_at == null and (.assets|length)==3' /tmp/draft-after.json
