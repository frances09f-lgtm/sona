name: Sona 1.2.38 drawing clip signed TEST
on:
  push:
    branches: [clip-repair-140]
    paths: ['.github/workflows/sona-clip.yml']
  workflow_dispatch:
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Kolkata
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/btc-weekend
      - name: Apply reviewed clipping patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d30e204d51ff31ac5d2969aed9ec5d018ce2fc99
          printf '%s'  | base64 -d > /tmp/clip.patch
          git apply --check /tmp/clip.patch
          git apply /tmp/clip.patch
      - id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - id: flutter_sdk
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - id: signing
        name: Restore existing signing identity
        run: |
          echo "${{ secrets.ORO_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/sona-release.jks
          cat >> android/gradle.properties <<GP
          ORO_KEYSTORE_FILE=$RUNNER_TEMP/sona-release.jks
          ORO_KEYSTORE_PASSWORD=${{ secrets.ORO_KEYSTORE_PASSWORD }}
          ORO_KEY_ALIAS=${{ secrets.ORO_KEY_ALIAS }}
          ORO_KEY_PASSWORD=${{ secrets.ORO_KEY_PASSWORD }}
          GP
      - id: dependencies
        run: flutter pub get
      - id: flutter_tests
        name: Safety tests and exact source contracts
        run: |
          set -o pipefail
          flutter test --machine > /tmp/flutter-results.jsonl
      - name: Save tested repair source without a second build
        run: |
          set -euo pipefail
          git config user.name sona-repair
          git config user.email sona-repair@users.noreply.github.com
          git add lib/chart/candle_chart.dart test/chart_drawing_clip_test.dart test/goldens/chart_drawing_tools.png pubspec.yaml
          git commit -m 'Sona 1.2.38 TEST: contain drawing tools inside chart price plot [skip ci]'
          git push origin HEAD:feature/btc-weekend
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - id: gradle_setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - id: native_task_check
        name: Verify release unit-test task exists before APK compilation
        run: |
          set -euo pipefail
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")" "$ANDROID_HOME" > android/local.properties
          cd android
          gradle :app:tasks --all > /tmp/sona-task-inventory.txt
          grep -E '^testReleaseUnitTest[[:space:]-]' /tmp/sona-task-inventory.txt
      - id: apk_build
        run: flutter build apk --release --target-platform android-arm64
      - id: native_tests
        name: Native caller and concurrent claim tests
        run: |
          set -euo pipefail
          (cd android && ./gradlew :app:testReleaseUnitTest)
          python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as E
          paths=glob.glob('build/app/test-results/testReleaseUnitTest/TEST-*.xml')
          roots=[E.parse(p).getroot() for p in paths]
          cases=[c for r in roots for c in r.findall('testcase')]
          expected={'concurrentUiAndHeadlessClaimOnlyOnce','replayedIdNeverBecomesExecutableAgain','distinctOrderCanBeClaimedAfterPriorConsumption','unrelatedUidIsDenied'}
          found={c.attrib['name'] for c in cases if c.attrib.get('classname')=='com.ambi.gold_paper_trading.FridayOrderStoreTest'}
          assert expected <= found, (paths,found)
          assert all(int(r.attrib.get(k,0))==0 for r in roots for k in ('failures','errors','skipped'))
          print('Native JUnit executed:',len(cases),'failures=0 errors=0 skipped=0')
          for c in cases: print(c.attrib['classname']+'.'+c.attrib['name'])
          PYTEST
      - id: apk_verify_transport
        name: Verify signed APK identity and PRIVATE draft transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs "$APK" > /tmp/cert.txt
          grep -F '54cfa6b82110b0d377f1f93fd767e08bb93a97362996637cecdb9208858f24e0' /tmp/cert.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          sed -n '1p' /tmp/badging.txt > /tmp/package.txt
          cat /tmp/package.txt
          grep -F "name='com.ambi.gold_paper_trading' versionCode='140' versionName='1.2.38'" /tmp/package.txt
          cp "$APK" /tmp/Sona.apk
          (cd /tmp && sha256sum Sona.apk) > /tmp/Sona.apk.sha256
          cat /tmp/Sona.apk.sha256
          printf 'Source: %s\nRun: %s/%s/actions/runs/%s\nPrivate test only. Full Flutter and native JUnit gates passed. Entry-price orders require open app and internet. Phone behavior unverified. Do not publish.\n' "$SOURCE_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/Sona-test-source.txt
          TAG="test-clip-140-${GITHUB_RUN_ID}"
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$SOURCE_SHA" -f name='Sona 1.2.38 TEST - chart drawing boundary repair' -F draft=true -f body='Private verified TEST transport only. Not an official app release. Phone behavior unverified. Do not publish.' > /tmp/draft-before.json
          DRAFT=$(jq -er '.id' /tmp/draft-before.json)
          jq -e '.draft == true and .published_at == null and (.assets|length)==0' /tmp/draft-before.json
          gh release upload "$TAG" /tmp/Sona.apk /tmp/Sona.apk.sha256 /tmp/Sona-test-source.txt --repo "$GITHUB_REPOSITORY"
          gh api repos/$GITHUB_REPOSITORY/releases/$DRAFT > /tmp/draft-after.json
          jq -e '.draft == true and .published_at == null and (.assets|length)==3' /tmp/draft-after.json
