name: Sona toolbar timeframe menu (tests and render, no APK)
on:
  workflow_dispatch:
  push:
    branches: [frances09f-lgtm-patch-1]
    paths: ['ci/fix4.patch.b64']
jobs:
  toolbar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Kolkata
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: Apply reviewed source patch
        run: |
          set -euo pipefail
          if [ -f ci/fix4.patch.b64 ]; then
            base64 -d ci/fix4.patch.b64 > /tmp/fix4.patch
            git apply --whitespace=nowarn /tmp/fix4.patch
            git rm -q ci/fix4.patch.b64
          fi
          git status --short
      - run: flutter pub get
      - name: Regenerate goldens that legitimately changed (timeframe chip row removed)
        continue-on-error: true
        run: flutter test --update-goldens test/fullscreen_editor_test.dart test/adaptive_grid_preview_test.dart test/zz_fix_preview_capture_test.dart 2>&1 | tail -n 15
      - name: Toolbar tests, plain output
        continue-on-error: true
        run: flutter test --reporter expanded test/chart_toolbar_test.dart test/fullscreen_editor_test.dart 2>&1 | tee /tmp/new.log
      - name: Render toolbar image
        continue-on-error: true
        run: |
          cat > test/zz_toolbar_render_test.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:sona/chart/candle_chart.dart';
          import 'fullscreen_editor_test.dart' show fakeCandles, loadFonts;

          void main() {
            testWidgets('render toolbar', (tester) async {
              SharedPreferences.setMockInitialValues({});
              await loadFonts();
              tester.view.physicalSize = const Size(1080, 2000);
              tester.view.devicePixelRatio = 2.5;
              addTearDown(tester.view.reset);
              final data = fakeCandles(96);
              await tester.pumpWidget(MaterialApp(
                debugShowCheckedModeBanner: false,
                home: FullscreenChartPage(
                  loader: (iv) async => data,
                  livePrice: data.last.close,
                  rangeMode: true,
                  quickTimeframes: true,
                  onTradeSide: (_) {},
                ),
              ));
              await tester.pumpAndSettle();
              await expectLater(find.byType(FullscreenChartPage),
                  matchesGoldenFile('goldens/toolbar_closed.png'));
              await tester.tap(find.text('15m'));
              await tester.pumpAndSettle();
              await expectLater(find.byType(MaterialApp),
                  matchesGoldenFile('goldens/toolbar_menu.png'));
            });
          }
          DART
          flutter test test/zz_toolbar_render_test.dart --update-goldens 2>&1 | tail -n 20
          rm -f test/zz_toolbar_render_test.dart
      - name: Full suite, plain output
        if: always()
        run: flutter test --reporter expanded 2>&1 | tee /tmp/full.log
      - name: Keep summaries
        if: always()
        run: |
          grep -E 'Some tests failed|All tests passed|\[E\]|FAILED|Error:|error:' /tmp/new.log | head -n 60 > test/goldens/ci_fix4_new_summary.txt || true
          tail -n 5 /tmp/new.log >> test/goldens/ci_fix4_new_summary.txt || true
          grep -A14 'EXCEPTION CAUGHT\|Expected:' /tmp/new.log | head -n 60 >> test/goldens/ci_fix4_new_summary.txt || true
          grep -E 'Some tests failed|All tests passed|\[E\]|FAILED' /tmp/full.log | head -n 60 > test/goldens/ci_fix4_full_summary.txt || true
          tail -n 5 /tmp/full.log >> test/goldens/ci_fix4_full_summary.txt || true
      - name: Commit to this branch
        if: always()
        run: |
          git config user.name "sona-repair"
          git config user.email "sona-repair@users.noreply.github.com"
          git add lib test
          git add -u ci || true
          git commit -m "Toolbar timeframe menu prep" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
