name: Background paper order TEST only
on:
  workflow_dispatch:
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: Restore existing signing identity
        run: |
          echo "${{ secrets.ORO_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/sona-release.jks
          cat >> android/gradle.properties <<GP
          ORO_KEYSTORE_FILE=$RUNNER_TEMP/sona-release.jks
          ORO_KEYSTORE_PASSWORD=${{ secrets.ORO_KEYSTORE_PASSWORD }}
          ORO_KEY_ALIAS=${{ secrets.ORO_KEY_ALIAS }}
          ORO_KEY_PASSWORD=${{ secrets.ORO_KEY_PASSWORD }}
          GP
      - run: flutter pub get
      - name: Safety tests and exact source contracts
        run: flutter test test/friday_orders_test.dart test/background_order_contract_test.dart test/trade_safety_test.dart test/paper_margin_test.dart test/execution_ledger_test.dart test/pending_orders_test.dart
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Verify release unit-test task exists before APK compilation
        run: |
          set -euo pipefail
          cd android
          gradle :app:tasks --all > /tmp/sona-task-inventory.txt
          grep -E '^testReleaseUnitTest[[:space:]-]' /tmp/sona-task-inventory.txt
      - run: flutter build apk --release --target-platform android-arm64
      - name: Native caller and concurrent claim tests
        run: cd android && ./gradlew :app:testReleaseUnitTest
      - name: Verify and save PRIVATE test only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs "$APK" > /tmp/cert.txt
          grep -F '54cfa6b82110b0d377f1f93fd767e08bb93a97362996637cecdb9208858f24e0' /tmp/cert.txt
          sha256sum "$APK"
          cp "$APK" /tmp/Sona.apk
          DRAFT=435746970
          gh api repos/$GITHUB_REPOSITORY/releases/$DRAFT > /tmp/draft-before.json
          jq -e '.draft == true and .published_at == null' /tmp/draft-before.json
          HASH=$(sha256sum /tmp/Sona.apk | cut -d' ' -f1)
          jq -n --arg sha "$GITHUB_SHA" --arg hash "$HASH" '{target_commitish:$sha,body:("Private background TEST only. Verified source: "+$sha+". SHA256: "+$hash+". Native concurrency/caller tests passed. Phone off-screen behavior unverified. Do not publish.")}' > /tmp/draft-body.json
          gh api --method PATCH repos/$GITHUB_REPOSITORY/releases/$DRAFT --input /tmp/draft-body.json > /tmp/draft-updated.json
          jq -e '.draft == true and .published_at == null' /tmp/draft-updated.json
          gh api --hostname uploads.github.com --method POST "repos/$GITHUB_REPOSITORY/releases/$DRAFT/assets?name=Sona.apk" --header 'Content-Type: application/vnd.android.package-archive' --input /tmp/Sona.apk > /tmp/asset.json
          jq '{id,name,size,browser_download_url}' /tmp/asset.json
